kind = "web"
previewPath = "/"
title = "Happy Bear Cozy Orchard"
version = "1.0.0"
id = "artifacts/happy-bear-orchard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18773

[services.development]
run = "pnpm --filter @workspace/happy-bear-orchard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/happy-bear-orchard", "run", "build" ]
publicDir = "artifacts/happy-bear-orchard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18773"
BASE_PATH = "/"
