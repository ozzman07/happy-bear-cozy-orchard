<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140">

  <!-- ── Body ── -->
  <ellipse cx="60" cy="118" rx="34" ry="26" fill="#c07828" stroke="#2a1208" stroke-width="2.5"/>

  <!-- ── Overalls ── -->
  <path d="M 36 108 Q 60 98 84 108 L 82 140 L 38 140 Z"
    fill="#3a6aaa" stroke="#1e4888" stroke-width="1.8"/>
  <!-- Straps -->
  <rect x="46" y="101" width="9"  height="20" rx="4.5" fill="#2a5898" stroke="#1e4888" stroke-width="1"/>
  <rect x="65" y="101" width="9"  height="20" rx="4.5" fill="#2a5898" stroke="#1e4888" stroke-width="1"/>
  <!-- Apple button -->
  <circle cx="60" cy="108" r="5" fill="#cc2218" stroke="#881410" stroke-width="1.2"/>
  <path d="M 59 105 Q 60 102 61 105" stroke="#2a7020" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- ── Head + ears as one path ── -->
  <path d="
    M 60 92
    C 44 92 28 86 24 72
    C 18 56 24 38 32 30
    C 28 22 30 14 36 12
    C 42 10 50 16 50 24
    C 54 20 57 18 60 18
    C 63 18 66 20 70 24
    C 70 16 78 10 84 12
    C 90 14 92 22 88 30
    C 96 38 102 56 96 72
    C 92 86 76 92 60 92 Z"
    fill="#c8882e" stroke="#2a1208" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- ── Inner ears ── -->
  <path d="M 36 14 C 32 18 34 26 40 26 C 44 24 46 18 42 14 Z" fill="#e8a84a" stroke="#b07020" stroke-width="1"/>
  <path d="M 84 14 C 88 18 86 26 80 26 C 76 24 74 18 78 14 Z" fill="#e8a84a" stroke="#b07020" stroke-width="1"/>

  <!-- ── Snout ── -->
  <path d="M 46 70 C 44 60 50 54 60 54 C 70 54 76 60 74 70 C 76 80 68 90 60 90 C 52 90 44 80 46 70 Z"
    fill="#e8a84a" stroke="#b07020" stroke-width="1.5"/>

  <!-- ── Eyes: happy squinting arches ── -->
  <path d="M 38 50 Q 46 41 54 50" stroke="#1a0c04" stroke-width="5"   fill="none" stroke-linecap="round"/>
  <path d="M 66 50 Q 74 41 82 50" stroke="#1a0c04" stroke-width="5"   fill="none" stroke-linecap="round"/>

  <!-- ── Nose ── -->
  <path d="M 55 64 C 54 60 56 57 60 57 C 64 57 66 60 65 64 C 66 69 63 72 60 72 C 57 72 54 69 55 64 Z"
    fill="#1a0c04"/>

  <!-- ── Smile ── -->
  <path d="M 48 76 Q 60 90 72 76" stroke="#1a0c04" stroke-width="2.8" fill="none" stroke-linecap="round"/>

  <!-- ── Cheek blush ── -->
  <ellipse cx="36" cy="66" rx="7" ry="5" fill="#dd4422" opacity="0.18"/>
  <ellipse cx="84" cy="66" rx="7" ry="5" fill="#dd4422" opacity="0.18"/>

  <!-- ── Left arm ── -->
  <path d="M 38 108 C 28 110 20 120 22 130 C 24 136 32 136 36 128 C 38 122 40 114 40 108 Z"
    fill="#c07828" stroke="#2a1208" stroke-width="2"/>

  <!-- ── Right arm + mug ── -->
  <path d="M 82 108 C 92 108 100 114 102 122 C 104 130 100 136 94 132 C 90 126 86 116 84 108 Z"
    fill="#c07828" stroke="#2a1208" stroke-width="2"/>

  <!-- Mug body -->
  <path d="M 96 86 C 94 82 96 78 102 77 C 108 77 112 81 110 86 L 108 108 C 108 112 96 112 94 108 Z"
    fill="#8a5020" stroke="#2a1208" stroke-width="2"/>
  <!-- Mug bands -->
  <path d="M 94 90 Q 102 87 110 90" stroke="#2a1208" stroke-width="3"   fill="none" stroke-linecap="round"/>
  <path d="M 93 101 Q 101 98 109 101" stroke="#2a1208" stroke-width="3"   fill="none" stroke-linecap="round"/>
  <!-- Handle -->
  <path d="M 110 90 C 120 90 122 98 122 102 C 122 108 118 112 110 110"
    stroke="#5a3010" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  <!-- Foam -->
  <path d="M 94 77 C 94 70 98 67 102 67 C 104 67 106 68 106 70 C 106 66 110 64 114 68 C 116 71 114 77 112 78 C 106 76 100 76 94 77 Z"
    fill="#f0e8d8" stroke="#c8c0a8" stroke-width="1"/>

</svg>
