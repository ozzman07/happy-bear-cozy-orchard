<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Happy Bear Cozy Orchard</title>
    <link rel="stylesheet" href="src/ui/styles.css" />
    <link rel="stylesheet" href="src/ui/intro.css" />
    <!-- Updated favicon to use the bear head SVG -->
    <link rel="icon" href="artifacts/happy-bear-orchard/public/bear.svg" />
  </head>
  <body>
    <div id="app"></div>

    <script type="module">
      import { BootRouter } from "./src/boot/BootRouter.js";
      import { mountRoot } from "./src/ui/initUI.js";

      mountRoot();
      BootRouter.start();
    </script>

    <!--
      Runtime fix: replace any occurrence of "Your Profiles"
      with "Profiles / Saved Games" so the UI label is updated
      even if the underlying component code lives elsewhere.
    -->
    <script>
      window.addEventListener('load', () => {
        const walker = document.createTreeWalker(
          document.body,
          NodeFilter.SHOW_TEXT,
          null,
          false
        );
        let node;
        while ((node = walker.nextNode())) {
          if (node.nodeValue.includes('Your Profiles')) {
            node.nodeValue = node.nodeValue.replace(/Your Profiles/g, 'Profiles / Saved Games');
          }
        }
      });
    </script>
  </body>
</html>
